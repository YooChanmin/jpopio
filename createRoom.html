<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>whatsong.io - 게임 대기실</title>
    <style>
        body { margin: 0; font-family: sans-serif; height: 100vh; overflow: hidden; }
        
        /* [레이아웃] 전체 컨테이너 */
        .main-layout { display: flex; height: 100%; }

        /* [왼쪽] 사이드바 */
        .sidebar {
            width: 280px; background-color: #2c3e50; color: white;
            padding: 20px; display: flex; flex-direction: column;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
        }
        .room-info {
            background-color: #34495e; padding: 15px; border-radius: 8px;
            text-align: center; margin-bottom: 20px;
        }
        .room-code-title { font-size: 14px; color: #bdc3c7; }
        .room-code-text { font-size: 32px; font-weight: bold; color: #f1c40f; letter-spacing: 2px; margin: 5px 0; }
        .copy-code-btn { 
            background: none; border: 1px solid #7f8c8d; color: #bdc3c7; 
            cursor: pointer; font-size: 12px; padding: 4px 8px; border-radius: 4px;
        }
        .copy-code-btn:hover { background-color: #7f8c8d; color: white; }
        .user-list-title { border-bottom: 1px solid #7f8c8d; padding-bottom: 10px; margin-bottom: 10px; font-size: 18px;}
        #userList { list-style: none; padding: 0; overflow-y: auto; flex-grow: 1; }
        #userList li { padding: 10px; border-bottom: 1px solid #34495e; display: flex; align-items: center; }
        #userList li::before { content: '👤'; margin-right: 10px; }
        #userList li.me { color: #2ecc71; font-weight: bold; }

        /* [오른쪽] 메인 컨텐츠 */
        .content {
            flex-grow: 1; background-color: #f0f2f5; padding: 40px;
            overflow-y: auto; text-align: center;
        }

        /* 스타일 */
        .input-style { 
            padding: 8px; font-size: 14px; margin: 5px; height: 40px;
            box-sizing: border-box; text-align: center;
            border: 1px solid #ccc; border-radius: 4px;
        }
        .textarea-style {
            width: 90%; max-width: 700px; height: 250px;
            padding: 10px; margin: 10px auto; display: block;
            border: 1px solid #333; background-color: #fff; border-radius: 4px;
            font-family: monospace;
        }
        button { cursor: pointer; border-radius: 4px; border: 1px solid #999; padding: 8px 15px; margin: 5px; }
        
        .start-btn { 
            padding: 15px 50px; font-size: 24px; margin-top: 30px; 
            background-color: #e74c3c; color: white; border: none; font-weight: bold;
            box-shadow: 0 4px 0 #c0392b;
        }
        .start-btn:hover { background-color: #c0392b; transform: translateY(2px); box-shadow: 0 2px 0 #a93226; }

        .file-btn { background-color: #2196F3; color: white; border: none; }
        .file-btn:hover { background-color: #0b7dda; }
        .set-custom-btn { background-color: #607D8B; color: white; border: none; }
    </style>
</head>
<body>
    <div class="main-layout">
        
        <aside class="sidebar">
            <div class="room-info">
                <div class="room-code-title">ROOM CODE</div>
                <div id="roomCodeDisplay" class="room-code-text">...</div>
                <button class="copy-code-btn" onclick="copyRoomCode()">코드 복사</button>
            </div>
            <div class="user-list-title">접속 유저 <span id="userCount">(0)</span></div>
            <ul id="userList"></ul>
        </aside>

        <main class="content">
            <h1>게임 설정</h1>
            <p>참가자들이 들어오면 게임을 시작하세요!</p>

            <button class="start-btn" onclick="startGame()">🔥 게임 시작</button>
            <br><br>
            <button id="toggleBtn" class="set-custom-btn" onclick="toggleView()">커스텀 문제 확인</button>
            
            <br><br><hr><br>

            <div id="basicSettings">
                <span>라운드 수 </span>
                <select id="roundsSelect" class="input-style" style="width: 200px;" onchange="toggleRoundInput(this)">
                    <option value="5">5</option>
                    <option value="10">10</option>
                    <option value="20">20</option>
                    <option value="50">50</option>
                    <option value="custom">직접 입력...</option>
                </select>
                <span id="customRoundArea" style="display: none;">
                    <input type="number" id="roundsInput" class="input-style" placeholder="숫자" style="width: 80px;">
                    <button onclick="resetRoundInput()" style="border:none; background:none;">↺</button>
                </span>
                <br>
                <span>라운드 시간 </span>
                <select id="timeSelect" class="input-style" style="width: 200px;">
                    <option value="15">15초</option>
                    <option value="30">30초</option>
                    <option value="45">45초</option>
                    <option value="60">60초</option>
                    <option value="90">90초</option>
                </select>
                <br>
                <span>힌트 </span>
                <select id="hintOnOffSelect" class="input-style" style="width: 200px;">
                    <option value="off">끄기</option>
                    <option value="on">켜기</option>
                </select>
                <br>
                <span>스킵 투표율 </span>
                <select id="skipVoteRatioSelect" class="input-style" style="width: 200px;">
                    <option value="noSkip">스킵 없음</option>
                    <option value="overHalf">과반수 이상</option>
                    <option value="all">전부</option>
                </select>
                <br>
                <span>채팅모드 </span>
                <select id="chatModeSelect" class="input-style" style="width: 200px;">
                    <option value="separated">정답자 채팅 분리</option>
                    <option value="censored">정답 검열</option>
                </select>
            </div>

            <div id="customViewer" style="display: none;">
                <p>데이터를 확인하거나 수정 후 저장할 수 있습니다.</p>
                <button class="file-btn" onclick="document.getElementById('fileInput').click()">📂 불러오기</button>
                <button class="file-btn" onclick="exportToJson()">💾 저장하기</button>
                <input type="file" id="fileInput" style="display: none;" onchange="importFromFile(this)" accept=".json">
                
                <textarea id="jsonEditor" class="textarea-style"></textarea>
            </div>
        </main>
    </div>

    <script src="/socket.io/socket.io.js"></script>

    <script>
        const socket = io();
        let currentRoomCode = null;
        let myNickname = sessionStorage.getItem("nickname");

        // 기본 템플릿 (데이터 없을 때 보여줄 예시)
        const defaultTemplate = [
            {
                "link": "https://youtu.be/example1",
                "startTime": "0",
                "answer": "정답1,정답2",
                "hint": "힌트 예시"
            },
            {
                "link": "https://youtu.be/example2",
                "startTime": "30",
                "answer": "정답A",
                "hint": "두 번째 문제"
            }
        ];

        // [1] 페이지 로드 시
        window.onload = function() {
            if(!myNickname) {
                alert("로그인이 필요합니다.");
                window.location.href = '/';
                return;
            }

            // 1. 커스텀 데이터 로드 (없으면 템플릿 채우기)
            const savedData = sessionStorage.getItem("customProblems");
            const editor = document.getElementById('jsonEditor');
            
            let hasData = false;

            if (savedData && savedData !== "[]") {
                try {
                    const parsed = JSON.parse(savedData);
                    if(parsed.length > 0) {
                        editor.value = JSON.stringify(parsed, null, 2);
                        hasData = true;
                    }
                } catch (e) { console.error(e); }
            }

            // 데이터가 없으면 예시 템플릿 보여주기
            if (!hasData) {
                editor.value = JSON.stringify(defaultTemplate, null, 2);
            }

            // 2. 서버에서 방 코드 받아오기
            fetch('/generate-code')
            .then(res => res.json())
            .then(data => {
                currentRoomCode = data.roomCode;
                document.getElementById('roomCodeDisplay').innerText = currentRoomCode;

                socket.emit('join_room', {
                    nickname: myNickname,
                    roomCode: currentRoomCode
                });
            })
            .catch(err => console.error("방 생성 실패:", err));
        };

        // [2] 소켓 이벤트
        socket.on('user_joined', (data) => updateUserList(data.users));
        socket.on('user_left', (data) => console.log(`${data.nickname} 퇴장`));

        function updateUserList(users) {
            const list = document.getElementById('userList');
            const count = document.getElementById('userCount');
            list.innerHTML = "";
            count.innerText = `(${users.length})`;
            users.forEach(user => {
                const li = document.createElement('li');
                li.innerText = user;
                if(user === myNickname) li.classList.add('me');
                list.appendChild(li);
            });
        }

        // [3] 게임 시작 요청
        function startGame() {
            if(!currentRoomCode) return;

            const selectTag = document.getElementById('roundsSelect');
            const inputTag = document.getElementById('roundsInput');
            let finalRounds = (selectTag.value === 'custom') ? inputTag.value : selectTag.value;

            if (selectTag.value === 'custom' && !finalRounds) {
                alert("라운드 수를 입력해주세요."); return;
            }

            let customList = [];
            const textData = document.getElementById('jsonEditor').value.trim();
            if (textData) {
                try { customList = JSON.parse(textData); } catch (e) {
                    alert("커스텀 문제 오류:\n" + e.message); return;
                }
            }

            fetch('/update-room-settings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    roomCode: currentRoomCode,
                    rounds: finalRounds,
                    time: document.getElementById('timeSelect').value,
                    hint: document.getElementById('hintOnOffSelect').value,
                    skipVoteRatio: document.getElementById('skipVoteRatioSelect').value,
                    chatMode: document.getElementById('chatModeSelect').value,
                    customList: customList
                }),
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    window.location.href = `/inGame?room=${currentRoomCode}`;
                } else {
                    alert(data.message);
                }
            });
        }

        // --- 기타 UI 함수들 ---
        
        async function exportToJson() {
            const text = document.getElementById('jsonEditor').value;
            if(!text) return alert("저장할 데이터가 없습니다.");
            
            if ('showSaveFilePicker' in window) {
                try {
                    const handle = await window.showSaveFilePicker({
                        suggestedName: 'game_data.json',
                        types: [{ description: 'JSON File', accept: {'application/json': ['.json']} }],
                    });
                    const writable = await handle.createWritable();
                    await writable.write(text);
                    await writable.close();
                    return;
                } catch (err) {
                    if (err.name !== 'AbortError') console.error(err);
                    return;
                }
            }
            const blob = new Blob([text], {type: "application/json"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'game_data.json';
            a.click(); URL.revokeObjectURL(url);
        }

        function copyRoomCode() {
            if(!currentRoomCode) return;
            navigator.clipboard.writeText(currentRoomCode);
            alert("방 코드가 복사되었습니다: " + currentRoomCode);
        }

        function toggleView() {
            const basic = document.getElementById('basicSettings');
            const custom = document.getElementById('customViewer');
            const btn = document.getElementById('toggleBtn');
            if(custom.style.display === 'none') {
                custom.style.display = 'block'; basic.style.display = 'none';
                btn.innerText = "기본 설정으로 돌아가기";
            } else {
                custom.style.display = 'none'; basic.style.display = 'block';
                btn.innerText = "커스텀 문제 확인";
            }
        }

        function importFromFile(input) {
            const file = input.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const loaded = JSON.parse(e.target.result);
                    if(Array.isArray(loaded)) {
                        document.getElementById('jsonEditor').value = JSON.stringify(loaded, null, 2);
                        alert("파일 로드 완료");
                    } else alert("배열 형식이 아닙니다.");
                } catch(err) { alert("파일 오류"); }
            };
            reader.readAsText(file);
            input.value = '';
        }

        function toggleRoundInput(selectTag) {
            const customArea = document.getElementById('customRoundArea');
            if (selectTag.value === 'custom') {
                selectTag.style.display = 'none';
                customArea.style.display = 'inline-block';
                document.getElementById('roundsInput').focus();    
            }
        }
        function resetRoundInput() {
            document.getElementById('customRoundArea').style.display = 'none';
            const sel = document.getElementById('roundsSelect');
            sel.style.display = 'inline-block'; sel.value = '5'; 
        }
    </script>
</body>
</html>
