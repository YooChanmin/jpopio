<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>whatsong.io - 방 설정</title>
    <style>
        body { text-align: center; margin-top: 50px; }
        
        /* 모든 입력창 디자인 통일 */
        .input-style { 
            padding: 8px; 
            font-size: 16px; 
            margin: 10px;
            width: 200px;
            height: 40px;
            box-sizing: border-box;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        /* 되돌리기(취소) 버튼 */
        .reset-btn {
            cursor: pointer;
            background: none;
            border: none;
            font-size: 20px;
            color: #666;
            vertical-align: middle;
        }

        button.start-btn { 
            padding: 10px 30px; 
            font-size: 18px; 
            margin-top: 20px; 
            cursor: pointer; 
            background-color: #f0f0f0;
            border: 1px solid #999;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>방 설정</h1>
    <p>게임 옵션을 선택하세요</p>
    <br>

    <span>라운드 수 </span>
    
    <select id="roundsSelect" class="input-style" onchange="toggleRoundInput(this)">
        <option value="5">5</option>
        <option value="10">10</option>
        <option value="20">20</option>
        <option value="50">50</option>
        <option value="100">100</option>
        <option value="custom">직접 입력...</option>
    </select>

    <span id="customRoundArea" style="display: none;">
        <input type="number" id="roundsInput" class="input-style" placeholder="숫자 입력" style="width: 160px;">
        <button class="reset-btn" onclick="resetRoundInput()" title="목록에서 선택하기">↺</button>
    </span>

    <br>

    <span>라운드 시간 </span>
    <select id="timeSelect" class="input-style">
        <option value="15">15</option>
        <option value="30">30</option>
        <option value="45">45</option>
        <option value="60">60</option>
        <option value="75">75</option>
        <option value="90">90</option>
    </select>

    <br>

    <span>힌트 </span>
    <select id="hintOnOffSelect" class="input-style">
        <option value="off">끄기</option>
        <option value="on">켜기</option>
    </select>

    <br>

    <span>스킵 투표율 </span>
    <select id="skipVoteRatioSelect" class="input-style">
        <option value="noSkip">스킵 없음</option>
        <option value="overHalf">과반수 이상</option>
        <option value="all">전부</option>
    </select>

    <br>

    <span>채팅모드 </span>
    <select id="chatModeSelect" class="input-style">
        <option value="separated">정답자 채팅 분리</option>
        <option value="censored">정답 검열</option>
    </select>
    
    <br><br>
    
    <button class="start-btn" onclick="createRoom()">게임 시작</button>

    <script>
        // 1. 드롭다운 변경 감지 함수
        function toggleRoundInput(selectTag) {
            const customArea = document.getElementById('customRoundArea');
            const roundsInput = document.getElementById('roundsInput');

            if (selectTag.value === 'custom') {
                // 직접 입력을 선택하면 -> 드롭다운 숨기고, 입력창 보이기
                selectTag.style.display = 'none';
                customArea.style.display = 'inline-block';
                roundsInput.value = ''; // 입력창 비우기
                roundsInput.focus();    // 커서 자동 이동
            }
        }

        // 2. 되돌리기 버튼 함수 (입력창 -> 드롭다운)
        function resetRoundInput() {
            const selectTag = document.getElementById('roundsSelect');
            const customArea = document.getElementById('customRoundArea');

            // 입력창 숨기고 드롭다운 다시 보이기
            customArea.style.display = 'none';
            selectTag.style.display = 'inline-block';
            selectTag.value = '5'; // 기본값으로 초기화
        }

        // 3. 게임 시작 함수
        function createRoom() {
            const selectTag = document.getElementById('roundsSelect');
            const inputTag = document.getElementById('roundsInput');
            
            let finalRounds;

            // 현재 어떤 모드인지 확인해서 값 가져오기
            // 드롭다운이 숨겨져 있다(=직접 입력 모드)
            if (selectTag.style.display === 'none') {
                finalRounds = inputTag.value;
                if (!finalRounds) {
                    alert("라운드 수를 입력해주세요.");
                    return;
                }
            } else {
                // 드롭다운 모드
                finalRounds = selectTag.value;
            }

            const time = document.getElementById('timeSelect').value;
            const hint = document.getElementById('hintOnOffSelect').value;
            const skipVoteRatio = document.getElementById('skipVoteRatioSelect').value;
            const chatMode = document.getElementById('chatModeSelect').value;

            fetch('http://localhost:3000/create-room-data', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    rounds: finalRounds,
                    time: time, 
                    hint: hint, 
                    skipVoteRatio: skipVoteRatio, 
                    chatMode: chatMode 
                }),
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    window.location.href = '/inGame'; 
                }
            })
            .catch(err => console.error(err));
        }
    </script>
</body>
</html>
