<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>whatsong.io - 방 설정</title>
    <style>
        body { text-align: center; margin-top: 50px; }
        select { padding: 5px; font-size: 16px; margin: 10px; }
        button { padding: 10px 30px; font-size: 18px; margin-top: 20px; cursor: pointer; /*background-color: #4CAF50; color: white; border: none;*/}
    </style>
</head>
<body>
    <h1>방 설정</h1>
    <p>게임 옵션을 선택하세요</p>
    <br>

    
    <span>라운드 수 </span>
    
    <select id="roundSelect">
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>
        <option value="10">10</option>
        <option value="11">11</option>
        <option value="12">12</option>
        <option value="13">13</option>
        <option value="14">14</option>
        <option value="15">15</option>
        <option value="16">16</option>
        <option value="17">17</option>
        <option value="18">18</option>
        <option value="19">19</option>
        <option value="20">20</option>
    </select>

    <br>

    <span>라운드 시간 </span>
    
    <select id="timeSelect">
        <option value="15">15</option>
        <option value="30">30</option>
        <option value="45">45</option>
        <option value="60">60</option>
        <option value="75">75</option>
        <option value="90">90</option>
    </select>
    
    <br><br>
    
    <button onclick="createRoom()">게임 시작</button>

    <script>
        function createRoom() {
            // 1. 선택된 값 가져오기
            const rounds = document.getElementById('roundSelect').value;
            const time = document.getElementById('timeSelect').value;

            // 2. 서버로 전송
            fetch('http://localhost:3000/create-room-data', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    rounds: rounds,
                    time: time 
                }),
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    alert(data.message); 
                    // 나중에 여기에 게임 시작 페이지로 이동하는 코드 추가
                }
            })
            .catch(err => console.error(err));
        }
    </script>
</body>
</html>
