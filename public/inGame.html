<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>whatsong.io - 플레이</title>
    <style>
        body { margin: 0; font-family: 'Nanum Gothic', sans-serif; background-color: #2c3e50; color: white; display: flex; height: 100vh; overflow: hidden; }
        .left-panel { width: 250px; background-color: #34495e; padding: 20px; display: flex; flex-direction: column; border-right: 1px solid #222; flex-shrink: 0; }
        .timer-box { font-size: 40px; font-weight: bold; color: #e74c3c; text-align: center; margin-bottom: 20px; background: #2c3e50; padding: 10px; border-radius: 10px; }
        .round-info { text-align: center; margin-bottom: 20px; color: #bdc3c7; }
        .score-board { flex-grow: 1; overflow-y: auto; }
        .player-row { padding: 10px; border-bottom: 1px solid #7f8c8d; display: flex; justify-content: space-between; align-items: center; }
        .player-row.me { color: #2ecc71; font-weight: bold; }
        
        .main-area { flex-grow: 1; background-color: #2c3e50; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; overflow: hidden; }
        #waitingScreen { position: absolute; width: 100%; height: 100%; background: #2c3e50; display: flex; justify-content: center; align-items: center; z-index: 600; }
        #youtube-container { width: 80%; max-width: 800px; aspect-ratio: 16 / 9; background: #000; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden; opacity: 0; pointer-events: none; margin-bottom: 30px; }
        #youtube-container.show { opacity: 1; pointer-events: auto; }
        #player { width: 100%; height: 100%; }
        #answerDisplay { font-size: 50px; color: #f1c40f; font-weight: bold; display: none; margin-bottom:10px; }
        #hintBox { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); font-size: 24px; color: #3498db; background: rgba(0,0,0,0.8); padding: 12px 30px; border-radius: 30px; display: none; z-index: 500; border: 1px solid #3498db; }
        #centerInstruction { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 40px; font-weight: bold; color: white; text-align: center; width: 100%; pointer-events: none; z-index: 400; }
        
        .right-panel { width: 300px; background-color: #222; display: flex; flex-direction: column; border-left: 1px solid #444; flex-shrink: 0; }
        .chat-header { padding: 15px; background: #333; text-align: center; font-weight: bold; }
        #chatList { flex-grow: 1; overflow-y: auto; list-style: none; padding: 10px; margin: 0; background-color: #1a1a1a; }
        #chatList li { padding: 4px 0; font-size: 14px; word-wrap: break-word; color: #ddd; }
        
        .chat-system { color: #f39c12 !important; font-weight: bold; text-align: center; }
        .chat-correct { color: #2ecc71 !important; font-weight: bold; text-align: center; }
        .chat-gray { color: #888 !important; }
        .chat-gray-word { color: #888; }
        
        .input-bar { padding: 10px; background: #333; }
        #chatInput { width: 100%; padding: 10px; border: none; border-radius: 4px; font-size: 14px; background: #eee; outline: none; box-sizing: border-box; color: #333; }
        
        .control-btns-wrapper { position: fixed; top: 10px; right: 310px; display: flex; flex-direction: column; gap: 10px; z-index: 1000; align-items: flex-end; }
        .control-btn { color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        .kick-btn-sm { padding: 1px 5px; background-color: #e74c3c; color: white; border: none; font-size: 10px; border-radius: 3px; cursor: pointer; margin-left: 5px; }
        #settingsBtn { background: rgba(52, 73, 94, 0.9); border: 1px solid #7f8c8d; }
        #skipBtn { background-color: #3498db; }
        #skipBtn:disabled { background-color: #555; cursor: not-allowed; }

        #settingsModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2000; justify-content: center; align-items: center; }
        .modal-content { background: #34495e; color: white; padding: 25px; border-radius: 10px; width: 280px; text-align: center; border: 1px solid #7f8c8d; }
    </style>
</head>
<body>
    <div class="control-btns-wrapper">
        <button id="settingsBtn" class="control-btn" onclick="openSettings()">⚙️ 환경설정</button>
        <button id="skipBtn" class="control-btn" onclick="voteSkip()">⏭️ 스킵 투표 (0/0)</button>
    </div>

    <div id="settingsModal" onclick="closeSettings(event)">
        <div class="modal-content">
            <h2 style="margin-top:0;">🔊 환경설정</h2>
            <div style="margin: 20px 0;">
                <label>게임 볼륨: <span id="volumeValue">50</span>%</label><br><br>
                <input type="range" id="volumeSlider" min="0" max="100" value="50" oninput="saveVolume(this.value)" style="width:100%;">
            </div>
            <button onclick="document.getElementById('settingsModal').style.display='none'" style="padding:8px 20px; background:#e74c3c; color:white; border:none; border-radius:5px; cursor:pointer;">닫기</button>
        </div>
    </div>

    <div id="hintBox">💡 힌트: <span id="hintText"></span></div>
    <div id="waitingScreen"><h1>🎮 곧 게임이 시작됩니다!</h1></div>
    
    <div class="left-panel">
        <div class="timer-box" id="timerDisplay">--</div>
        <div id="roundDisplay">준비 중</div>
        <h3>🏆 점수판</h3>
        <div class="score-board" id="scoreBoard"></div>
    </div>
    
    <div class="main-area">
        <div id="youtube-container"><div id="player"></div></div>
        <div id="answerDisplay">정답: ???</div>
        <div id="centerInstruction">시작을 기다리고 있습니다...</div>
    </div>
    
    <div class="right-panel">
        <div class="chat-header">💬 채팅 / 정답 입력</div>
        <ul id="chatList"></ul>
        <div class="input-bar"><input type="text" id="chatInput" placeholder="정답 입력..." autofocus></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        const socket = io();
        const params = new URLSearchParams(window.location.search);
        const roomCode = params.get('room');
        const nickname = sessionStorage.getItem("nickname");
        const isHostInitial = sessionStorage.getItem("isHost") === "true";
        let isHost = isHostInitial;
        
        let player, isPlayerReady = false, isRoundEnded = false, totalTime = 0, currentHint = null, globalVolume = localStorage.getItem('gameVolume') || 50;
        let currentRoundStartTime = 0;

        function openSettings() { 
            document.getElementById('volumeSlider').value = globalVolume;
            document.getElementById('volumeValue').innerText = globalVolume;
            document.getElementById('settingsModal').style.display = 'flex'; 
        }

        function closeSettings(e) { if (e.target.id === 'settingsModal') e.target.style.display = 'none'; }
        
        function saveVolume(val) {
            globalVolume = val; 
            document.getElementById('volumeValue').innerText = val; 
            localStorage.setItem('gameVolume', val);
            if (isPlayerReady && player && player.setVolume) player.setVolume(val);
        }

        function updateUIForRound(data) {
            isRoundEnded = false;
            document.getElementById('waitingScreen').style.display = 'none';
            const inst = document.getElementById('centerInstruction');
            if(inst) { 
                inst.innerText = "노래를 듣고 정답을 입력하세요!"; 
                inst.style.display = 'block'; 
            }
            document.getElementById('youtube-container').classList.remove('show');
            document.getElementById('answerDisplay').style.display = 'none';
            document.getElementById('hintBox').style.display = 'none';
            document.getElementById('roundDisplay').innerText = `Round ${data.round} / ${data.totalRounds}`;
            document.getElementById('skipBtn').innerText = `⏭️ 스킵 투표 (0/${data.requiredSkip})`;
            document.getElementById('skipBtn').disabled = false;
            
            totalTime = data.timeLimit; 
            currentHint = data.hint; 
            currentRoundStartTime = Number(data.startTime);

            if (isPlayerReady && player && player.loadVideoById) {
                player.loadVideoById({ 
                    videoId: extractVideoID(data.link), 
                    startSeconds: currentRoundStartTime 
                });
                player.setVolume(globalVolume);
            }
        }

        socket.on('round_start', (data) => {
            updateUIForRound(data);
        });

        socket.on('skip_update', (data) => { 
            document.getElementById('skipBtn').innerText = `⏭️ 스킵 투표 (${data.current}/${data.required})`; 
        });

        socket.on('timer_update', (timeLeft) => {
            document.getElementById('timerDisplay').innerText = timeLeft;
            if (currentHint && timeLeft <= (totalTime / 2)) {
                document.getElementById('hintText').innerText = currentHint;
                document.getElementById('hintBox').style.display = 'block';
            }
        });

        socket.on('round_end', (data) => {
            isRoundEnded = true;
            if(document.getElementById('centerInstruction')) {
                document.getElementById('centerInstruction').style.display = 'none';
            }
            document.getElementById('youtube-container').classList.add('show');
            document.getElementById('answerDisplay').innerText = `정답: ${data.answer.split(',')[0]}`;
            document.getElementById('answerDisplay').style.display = 'block';
            document.getElementById('skipBtn').disabled = true;
            
            if (isPlayerReady && player) { 
                player.seekTo(currentRoundStartTime, true); 
                player.playVideo(); 
            }
            updateScoreBoard(data.scores, data.hostId);
        });

        socket.on('chat_message', (data) => {
            const list = document.getElementById('chatList');
            const li = document.createElement('li');
            if (data.type === 'system') { 
                li.className = 'chat-system'; 
                li.innerText = data.msg; 
            } else if (data.type === 'chat_gray') { 
                li.className = 'chat-gray'; 
                li.innerHTML = `<b>${data.nickname}:</b> ${data.msg}`; 
            } else if (data.type === 'chat_html') { 
                li.innerHTML = `<b>${data.nickname}:</b> ${data.msg}`; 
            } else { 
                li.innerHTML = `<b>${data.nickname}:</b> ${data.msg}`; 
            }
            list.appendChild(li);
            list.scrollTop = list.scrollHeight;
        });

        socket.on('correct_answer', (data) => {
            const list = document.getElementById('chatList');
            const li = document.createElement('li'); 
            li.className = 'chat-correct';
            li.innerText = `🎉 ${data.nickname} 정답!`;
            list.appendChild(li);
            list.scrollTop = list.scrollHeight;
        });

        socket.on('change_host', (data) => { 
            if(socket.id === data.newHostId) { 
                isHost = true; 
                sessionStorage.setItem("isHost", "true"); 
                alert("👑 방장이 되었습니다!"); 
            } 
        });

        socket.on('kicked', () => {
            alert("방장에 의해 퇴장 처리되었습니다.");
            location.href = '/';
        });

        // 존재하지 않는 방 코드일 경우 처리
        socket.on('room_not_found', () => {
            alert("방을 찾을 수 없습니다.");
            location.href = '/';
        });

        socket.on('user_joined', (data) => {
            updateScoreBoard(data.users.map(u => ({ id: u.id, nickname: u.nickname, score: 0 })), data.hostId);
        });

        socket.on('update_score', (data) => {
            updateScoreBoard(data.players, data.hostId);
        });

        function onYouTubeIframeAPIReady() { 
            player = new YT.Player('player', { 
                height: '100%', 
                width: '100%', 
                playerVars: { 'autoplay': 1, 'controls': 0 }, 
                events: { 
                    'onReady': () => { isPlayerReady = true; } 
                } 
            });
        }

        function extractVideoID(url) { 
            const m = url.match(/^.*((youtu.be\/)|(v\/)|(\/u\/\w\/)|(embed\/)|(watch\?))\??v?=?([^#&?]*).*/); 
            return (m && m[7].length == 11) ? m[7] : false; 
        }

        function updateScoreBoard(players, hostId) {
            const board = document.getElementById('scoreBoard');
            board.innerHTML = players.sort((a,b) => b.score - a.score).map((p,i) => {
                const isMe = p.nickname === nickname;
                const canKick = isHost && !isMe;
                const kickBtn = canKick ? `<button class="kick-btn-sm" onclick="kickPlayer('${p.id}')">❌</button>` : '';
                return `
                <div class="player-row ${isMe ? 'me' : ''}">
                    <span>${i+1}. ${(p.id === hostId ? "👑 " : "") + p.nickname}${kickBtn}</span>
                    <span>${p.score || 0}</span>
                </div>`;
            }).join('');
        }

        function kickPlayer(id) {
            if(confirm("해당 플레이어를 퇴장시키겠습니까?")) {
                socket.emit('kick_player', id);
            }
        }

        function voteSkip() { 
            if (!isRoundEnded) {
                socket.emit('vote_skip'); 
            }
            document.getElementById('skipBtn').disabled = true; 
        }

        document.getElementById('chatInput').addEventListener('keypress', (e) => { 
            if(e.key === 'Enter' && e.target.value.trim()) { 
                socket.emit('send_chat', e.target.value.trim()); 
                e.target.value = ''; 
            } 
        });

        if (roomCode && nickname) {
            socket.emit('join_room', { nickname, roomCode: roomCode });
        }
    </script>
</body>
</html>
