<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>whatsong.io - 게임방</title>
    <style>
        body { 
            text-align: center; 
            font-family: sans-serif; 
            margin: 0;
            background-color: #333;
            color: white;
        }
        
        /* 상단 정보바 */
        .header {
            padding: 20px;
            background-color: #222;
            border-bottom: 2px solid #444;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .room-code {
            font-size: 24px;
            font-weight: bold;
            color: #FFC107;
        }
        
        /* 메인 컨텐츠 */
        .main-content {
            margin-top: 50px;
        }

        /* 플레이어 리스트 */
        .player-list-container {
            width: 300px;
            margin: 0 auto;
            background-color: #444;
            padding: 20px;
            border-radius: 10px;
        }
        .player-list-container h3 { margin-top: 0; border-bottom: 1px solid #666; padding-bottom: 10px; }
        
        #playerList {
            list-style: none;
            padding: 0;
            text-align: left;
        }
        #playerList li {
            padding: 8px 10px;
            border-bottom: 1px solid #555;
            font-size: 18px;
        }
        #playerList li:last-child { border-bottom: none; }

        .my-name { color: #4CAF50; font-weight: bold; } /* 내 이름은 초록색 */
    </style>
</head>
<body>

    <div class="header">
        <div class="room-code" id="roomCodeDisplay">ROOM CODE: ??????</div>
        <div>내 닉네임: <span id="myNicknameDisplay"></span></div>
    </div>

    <div class="main-content">
        <h1>게임 대기 중...</h1>
        
        <div class="player-list-container">
            <h3>접속한 플레이어</h3>
            <ul id="playerList">
                </ul>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    
    <script>
        // 1. 소켓 연결 시작
        const socket = io();

        // 2. URL에서 방 코드 추출 (?room=ABCDEF)
        const params = new URLSearchParams(window.location.search);
        const roomCode = params.get('room');

        // 3. sessionStorage에서 닉네임 가져오기
        const nickname = sessionStorage.getItem("nickname");

        // [방어 코드] 닉네임이나 방 코드가 없으면 홈으로 쫓아냄
        if (!nickname || !roomCode) {
            alert("잘못된 접근입니다. 로그인부터 해주세요.");
            window.location.href = '/';
        } else {
            // 화면에 정보 표시
            document.getElementById('roomCodeDisplay').innerText = `ROOM CODE: ${roomCode}`;
            document.getElementById('myNicknameDisplay').innerText = nickname;

            // 4. 서버에 "방 입장" 신호 보내기
            socket.emit('join_room', {
                nickname: nickname,
                roomCode: roomCode
            });
        }

        // ---------------- [소켓 이벤트 수신] ----------------

        // A. 누군가(나 포함) 들어왔을 때 -> 유저 리스트 갱신
        socket.on('user_joined', (data) => {
            console.log("유저 입장:", data.nickname);
            updateUserList(data.users);
        });

        // B. 누군가 나갔을 때
        socket.on('user_left', (data) => {
            console.log("유저 퇴장:", data.nickname);
            // 나간 사람 처리는 user_joined에서 전체 리스트를 다시 받거나,
            // 별도로 처리할 수 있습니다. 
            // 여기서는 간단하게 서버가 user_joined 때처럼 최신 리스트를 같이 보내주는 게 좋지만,
            // 일단 알림만 띄우거나 새로고침 유도 등 방법이 있습니다.
            // (서버 코드를 조금 더 고도화하면 'room_users_update' 같은 이벤트를 따로 만드는 게 정석입니다.)
            
            // 임시: 누가 나갔는지 알림 (실제 구현 시엔 리스트 자동 갱신 권장)
            // alert(`${data.nickname}님이 나갔습니다.`);
            
            // *팁: 서버에서 user_left 때도 남은 유저 리스트를 보내주면 좋습니다.
            // 일단 지금은 퇴장 로그만 찍습니다.
        });

        // 유저 리스트 화면 업데이트 함수
        function updateUserList(users) {
            const list = document.getElementById('playerList');
            list.innerHTML = ""; // 기존 목록 초기화

            users.forEach(user => {
                const li = document.createElement('li');
                li.innerText = user;
                
                // 내 이름이면 색깔 다르게
                if (user === nickname) {
                    li.classList.add('my-name');
                    li.innerText += " (나)";
                }
                list.appendChild(li);
            });
        }
    </script>
</body>
</html>
